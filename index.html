<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qur'anic Arabic Vocabulary</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7f6;
  color:#222;
  font-family:"Noto Sans Bengali",sans-serif;
}

button,input{font-family:"Noto Sans Bengali",sans-serif}

header{
  background:#075e54;
  color:white;
  text-align:center;
  padding:18px 12px;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:4px 0 0;
  font-size:14px;
}

nav{
  display:flex;
  gap:5px;
  overflow-x:auto;
  background:white;
  padding:9px 7px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

nav button{
  flex:1;
  min-width:75px;
  border:0;
  border-radius:8px;
  padding:9px 5px;
  background:#edf2f0;
  font-size:13px;
  white-space:nowrap;
}

nav button.active{
  background:#075e54;
  color:white;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px 14px 40px;
}

.section{display:none}
.section.active{display:block}

.card{
  background:white;
  border-radius:16px;
  padding:20px 15px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.counter{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.category-title{
  text-align:center;
  color:#075e54;
  font-weight:700;
  font-size:17px;
  margin-bottom:12px;
}

/* CATEGORY LIST */

.category-list{
  display:grid;
  gap:8px;
  margin-bottom:18px;
}

.category{
  width:100%;
  border:0;
  border-radius:11px;
  padding:12px;
  text-align:left;
  background:#edf2f0;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.category.unlocked{
  cursor:pointer;
}

.category.unlocked:hover{
  background:#dfeae7;
}

.category.current{
  background:#075e54;
  color:white;
}

.category.locked{
  color:#888;
  background:#f0f0f0;
  cursor:not-allowed;
}

.category small{
  font-size:12px;
}

.category-progress{
  font-size:12px;
  white-space:nowrap;
}

/* Arabic */

.arabic-word{
  font-family:"Noto Naskh Arabic",serif !important;
  direction:rtl;
  unicode-bidi:plaintext;
  text-align:center;
  font-size:55px;
  font-weight:600;
  line-height:1.9;
  color:#111;
  cursor:pointer;
  user-select:none;
  margin:5px 0;
}

.meaning{
  font-family:"Noto Sans Bengali",sans-serif !important;
  text-align:center;
  font-size:21px;
  font-weight:600;
  color:#075e54;
  min-height:42px;
  margin:5px 0 14px;
}

.hidden{visibility:hidden}

.example-btn{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #075e54;
  background:white;
  color:#075e54;
  font-size:15px;
}

.example-box{
  display:none;
  background:#f1f8f5;
  border-radius:12px;
  padding:15px 10px;
  margin-top:10px;
  text-align:center;
}

.example-box.show{display:block}

.example-arabic{
  font-family:"Noto Naskh Arabic",serif !important;
  direction:rtl;
  unicode-bidi:plaintext;
  font-size:31px;
  line-height:2;
  color:#111;
}

.example-bangla{
  font-family:"Noto Sans Bengali",sans-serif !important;
  font-size:17px;
  line-height:1.8;
  margin-top:8px;
}

.reference{
  font-size:14px;
  color:#075e54;
  font-weight:600;
  margin-top:7px;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:17px;
}

.actions button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px 6px;
  font-size:14px;
}

.learned-btn{
  background:#075e54;
  color:white;
}

.study-btn{
  background:#e8edeb;
  color:#222;
}

.back-btn{
  width:100%;
  margin-top:10px;
  border:0;
  background:#333;
  color:white;
  border-radius:10px;
  padding:11px;
}

/* PRACTICE */

.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:15px;
}

.modes button{
  border:0;
  border-radius:9px;
  padding:10px 5px;
  background:#edf2f0;
  font-size:13px;
}

.modes button.active{
  background:#075e54;
  color:white;
}

.practice-count{
  text-align:center;
  color:#777;
  font-size:14px;
}

.question-label{
  text-align:center;
  color:#777;
  margin-top:15px;
}

#practiceQuestion{
  font-family:"Noto Naskh Arabic",serif !important;
  direction:rtl;
  text-align:center;
  font-size:42px;
  line-height:1.8;
  font-weight:600;
  margin:8px 0 20px;
}

#practiceQuestion.bangla{
  font-family:"Noto Sans Bengali",sans-serif !important;
  direction:ltr;
  font-size:25px;
}

.options{
  display:grid;
  gap:9px;
}

.option{
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  padding:12px;
  font-size:16px;
}

.option.correct{
  background:#d9f3e5;
  border-color:#16844a;
}

.option.wrong{
  background:#f7dddd;
  border-color:#c33;
}

.answer-input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
  text-align:center;
  margin-bottom:9px;
}

.check-btn,
.next-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  font-size:15px;
}

.check-btn{
  background:#075e54;
  color:white;
}

.next-btn{
  background:#333;
  color:white;
  margin-top:10px;
  display:none;
}

.feedback{
  text-align:center;
  font-weight:600;
  min-height:27px;
  margin-top:10px;
}

/* PROGRESS */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:white;
  border-radius:13px;
  padding:18px 8px;
  text-align:center;
  box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.stat-number{
  color:#075e54;
  font-size:28px;
  font-weight:700;
}

.stat-label{
  color:#666;
  font-size:14px;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.unlock-message{
  background:#f1f8f5;
  border-radius:11px;
  padding:12px;
  margin-bottom:14px;
  text-align:center;
  color:#075e54;
  font-size:14px;
}

@media(max-width:450px){
  .arabic-word{font-size:49px}
  .example-arabic{font-size:27px}
  #practiceQuestion{font-size:36px}
}
</style>
</head>

<body>

<header>
  <h1>📖 Qur'anic Arabic</h1>
  <p>কুরআনের আরবি শব্দ শেখা</p>
</header>

<nav>
  <button id="navLearn" class="active" onclick="showSection('learn')">
    📖 Learn
  </button>

  <button id="navPractice" onclick="showSection('practice')">
    📝 Practice
  </button>

  <button id="navReview" onclick="showSection('review')">
    📚 Review
  </button>

  <button id="navLearned" onclick="showSection('learned')">
    ✓ মুখস্থ
  </button>

  <button id="navProgress" onclick="showSection('progress')">
    📊 Progress
  </button>
</nav>

<div class="container">

<!-- ================= LEARN ================= -->

<section id="learn" class="section active">

<div class="card">

<div class="category-title">
  📚 ১৫০টি প্রাথমিক শব্দ
</div>

<div id="categoryList" class="category-list"></div>

<div id="unlockMessage" class="unlock-message"></div>

<div class="counter" id="learnCounter"></div>

<div id="learnCategoryTitle" class="category-title"></div>

<div
  id="learnWord"
  class="arabic-word"
  onclick="toggleMeaning('learn')">
</div>

<div
  id="learnMeaning"
  class="meaning hidden">
</div>

<button
  class="example-btn"
  onclick="toggleExample('learn',event)">
  📖 উদাহরণ দেখুন
</button>

<div id="learnExample" class="example-box">

<div id="learnExampleArabic" class="example-arabic"></div>

<div id="learnExampleBangla" class="example-bangla"></div>

<div id="learnReference" class="reference"></div>

</div>

<div class="actions">

<button
  class="learned-btn"
  onclick="learnCurrent()">
  ✓ মুখস্থ হয়েছে
</button>

<button
  class="study-btn"
  onclick="studyCurrent()">
  📚 পড়তে হবে
</button>

</div>

</div>
</section>


<!-- ================= PRACTICE ================= -->

<section id="practice" class="section">

<div class="card">

<div class="category-title">
  📝 আগে পড়া শব্দ দিয়ে Practice
</div>

<div id="practiceAvailable" class="unlock-message"></div>

<div class="modes">

<button id="mode1" class="active" onclick="setMode(1)">
আরবি → বাংলা
</button>

<button id="mode2" onclick="setMode(2)">
বাংলা → আরবি
</button>

<button id="mode3" onclick="setMode(3)">
বাংলা লিখুন
</button>

<button id="mode4" onclick="setMode(4)">
আরবি লিখুন
</button>

</div>

<div class="practice-count" id="practiceCount"></div>

<div id="questionLabel" class="question-label"></div>

<div id="practiceQuestion"></div>

<div id="answerArea"></div>

<div id="feedback" class="feedback"></div>

<button
id="nextPractice"
class="next-btn"
onclick="nextPractice()">
পরের প্রশ্ন →
</button>

</div>
</section>


<!-- ================= REVIEW ================= -->

<section id="review" class="section">

<div class="card">

<div class="counter" id="reviewCounter"></div>

<div id="reviewWord"
class="arabic-word"
onclick="toggleMeaning('review')">
</div>

<div id="reviewMeaning"
class="meaning hidden">
</div>

<button
class="example-btn"
onclick="toggleExample('review',event)">
📖 উদাহরণ দেখুন
</button>

<div id="reviewExample" class="example-box">

<div id="reviewExampleArabic" class="example-arabic"></div>

<div id="reviewExampleBangla" class="example-bangla"></div>

<div id="reviewReference" class="reference"></div>

</div>

<div class="actions">

<button
class="learned-btn"
onclick="reviewToLearned()">
✓ মুখস্থ হয়েছে
</button>

<button
class="study-btn"
onclick="reviewNext()">
📚 আরও পড়ব
</button>

</div>

<button
class="back-btn"
onclick="showSection('learn')">
← Learn এ ফিরে যান
</button>

</div>
</section>


<!-- ================= LEARNED ================= -->

<section id="learned" class="section">

<div class="card">

<div class="counter" id="learnedCounter"></div>

<div id="learnedWord"
class="arabic-word"
onclick="toggleMeaning('learned')">
</div>

<div id="learnedMeaning"
class="meaning hidden">
</div>

<button
class="example-btn"
onclick="toggleExample('learned',event)">
📖 উদাহরণ দেখুন
</button>

<div id="learnedExample" class="example-box">

<div id="learnedExampleArabic" class="example-arabic"></div>

<div id="learnedExampleBangla" class="example-bangla"></div>

<div id="learnedReference" class="reference"></div>

</div>

<div class="actions">

<button
class="learned-btn"
onclick="learnedNext()">
✓ পরের মুখস্থ শব্দ
</button>

<button
class="study-btn"
onclick="learnedToReview()">
📚 আবার পড়তে হবে
</button>

</div>

</div>
</section>


<!-- ================= PROGRESS ================= -->

<section id="progress" class="section">

<div class="stats">

<div class="stat">
<div id="learnedCount" class="stat-number">0</div>
<div class="stat-label">মুখস্থ</div>
</div>

<div class="stat">
<div id="reviewCount" class="stat-number">0</div>
<div class="stat-label">পড়তে হবে</div>
</div>

<div class="stat">
<div id="remainingCount" class="stat-number">0</div>
<div class="stat-label">নতুন বাকি</div>
</div>

<div class="stat">
<div id="accuracyCount" class="stat-number">0%</div>
<div class="stat-label">Practice</div>
</div>

</div>

<div class="card" style="margin-top:15px">
<div class="category-title">📚 Section Progress</div>
<div id="progressCategories"></div>
</div>

</section>

</div>


<script>

/* =========================================================
   PDF CATEGORY DATA
   প্রথম অংশ PDF-এর ১৫০টি প্রাথমিক শব্দের structure অনুযায়ী
========================================================= */

const categories = [

{
 id:"one-letter",
 title:"এক অক্ষর বিশিষ্ট শব্দ",
 icon:"🔓",
 words:[
  ["أ","কী?"],
  ["ب","সাথে / দ্বারা"],
  ["ل","জন্য"],
  ["ف","অতঃপর"],
  ["ك","মতো"],
  ["و","এবং"],
  ["س","শীঘ্রই"],
  ["كَ","তোমার / তোমাকে"],
  ["هُ / ه","তার / তাকে"],
  ["ي","আমার / আমাকে"]
 ]
},

{
 id:"pronouns",
 title:"মূল সর্বনাম",
 icon:"🔒",
 words:[
  ["هُوَ","সে"],
  ["هُمْ","তারা"],
  ["أَنْتَ","তুমি"],
  ["أَنْتُمْ","তোমরা"],
  ["أَنَا","আমি"],
  ["نَحْنُ","আমরা"],
  ["هِيَ","সে (স্ত্রী)"],
  ["هُنَّ","তারা (স্ত্রী)"],
  ["أَنْتِ","তুমি (স্ত্রী)"],
  ["أَنْتُنَّ","তোমরা (স্ত্রী)"],
  ["هُمَا","তারা দুজন"],
  ["أَنْتُمَا","তোমরা দুজন"]
 ]
},

{
 id:"attached-pronouns",
 title:"যুক্ত সর্বনাম",

  ["هُم","তাদের / তাদেরকে"],
  ["كَ","তোমাকে / তোমার"],
  ["كُمْ","তোমাদের / তোমাদেরকে"],
  ["ي","আমাকে / আমার"],
  ["نَا","আমাদের / আমাদেরকে"]
 ]
},

{
 id:"particles",
 title:"অব্যয়",
 icon:"🔒",
 words:[

  ["عَنْ","সম্পর্কে / হতে"],
  ["فِي","মধ্যে"],

  ["وَ","এবং / কসম"]
 ]
},

{
 id:"ma-words",
 title:"মা-যুক্ত শব্দ",
 icon:"🔒",
 words:[
  ["بِمَا","যেহেতু / যা দ্বারা"],
  ["عَمَّا","যা সম্পর্কে"],
  ["فِيمَا","যার মধ্যে / যা বিষয়ে"],
  ["كَمَا","যেমন / যেভাবে"],

  ["أَمَّا","আর / অতঃপর"],

 ]
},

{

{

 title:"শর্তবাচক",
 icon:"🔒",
 words:[
  ["إِنَّ","নিশ্চয়ই"],
  ["أَنَّ","যে"],
  ["أَنْ","যে / যাতে"],
  ["إِنْ","যদি"],
  ["لَوْ","যদি"],
  ["كَأَنَّ","যেন"],

  ["إِذَا","যখন"],
  ["يَا","হে"],
  ["أَيُّهَا","হে"]
 ]
},

{
 id:"demonstrative",
 title:"নির্দেশবাচক",
 icon:"🔒",

  ["هُنَالِكَ","সেখানে"]
 ]
},

{
 id:"directions",
 title:"দিক-নির্দেশক",
 icon:"🔒",
 words:[
  ["فَوْقَ","উপরে"],
  ["تَحْتَ","নিচে"],
  ["بَيْنَ يَدَيْ","সামনে"],
  ["خَلْفَ","পেছনে"],
  ["أَمَامَ","সামনে"],
  ["وَرَاءَ","পেছনে"],
  ["أَيْمَانَ","ডান দিকে"],
  ["شَمَائِلَ","বাম দিকে"],
  ["بَيْنَ","মধ্যে"],
  ["حَوْلَ","চারদিকে"],
  ["حَيْثُ","যেখানে"],
  ["أَيْنَمَا","যেখানেই"]
 ]
},

{
 id:"questions",
 title:"প্রশ্নবাচক",
 icon:"🔒",
 words:[
  ["مَا","কি?"],
  ["مَنْ","কে?"],

let words = [];

categories.forEach((cat,catIndex)=>{

  cat.words.forEach((item,wordIndex)=>{

    words.push({
      id:cat.id+"-"+wordIndex,
      arabic:item[0],
      meaning:item[1],
      category:catIndex,
      categoryId:cat.id,
      categoryTitle:cat.title,
      example:"",
      translation:"",
      surah:"",
      ayah:""
    });

  });

});


/* =========================================================
   STORAGE
========================================================= */

let learnedWords =
JSON.parse(localStorage.getItem("learnedWords") || "[]");

let studyWords =
JSON.parse(localStorage.getItem("studyWords") || "[]");

let completedCategories =
JSON.parse(localStorage.getItem("completedCategories") || "[]");

let practiceAttempts =
Number(localStorage.getItem("practiceAttempts") || 0);

let practiceRight =
Number(localStorage.getItem("practiceRight") || 0);

let selectedCategory =
Number(localStorage.getItem("selectedCategory") || 0);


/* =========================================================
   CURRENT
========================================================= */

let learnIndex=-1;
let reviewPosition=0;
let learnedPosition=0;

let meaningState={
  learn:false,
  review:false,
  learned:false
};

let exampleState={
  learn:false,
  review:false,
  learned:false
};


/* =========================================================
   CATEGORY SYSTEM
========================================================= */

function categoryWordIndexes(categoryIndex){

  return words
    .map((w,i)=>w.category===categoryIndex ? i : -1)
    .filter(i=>i!==-1);

}


function isCategoryUnlocked(index){

  if(index===0) return true;

  return completedCategories.includes(index-1);
}


function isCategoryComplete(index){

  const indexes=categoryWordIndexes(index);

  if(indexes.length===0) return false;

  return indexes.every(i =>
    learnedWords.includes(i) ||
    studyWords.includes(i)
  );

}


function updateCategoryCompletion(){

  for(let i=0;i<categories.length;i++){

    if(isCategoryComplete(i)){

      if(!completedCategories.includes(i)){
        completedCategories.push(i);
      }

    }else{

      /*
       * শুধু পরবর্তী unlock-এর জন্য completion দরকার।
       * আগের completed category পুনরায় খুলে রাখা হবে।
       */
    }

  }

  localStorage.setItem(
    "completedCategories",
    JSON.stringify(completedCategories)
  );
}


function renderCategories(){

  updateCategoryCompletion();

  const box=document.getElementById("categoryList");

  box.innerHTML="";

  categories.forEach((cat,index)=>{

    const unlocked=isCategoryUnlocked(index);
    const complete=isCategoryComplete(index);

    const btn=document.createElement("button");

    btn.className="category";

    if(unlocked){
      btn.classList.add("unlocked");
    }else{
      btn.classList.add("locked");
    }

    if(index===selectedCategory && unlocked){
      btn.classList.add("current");
    }

    const indexes=categoryWordIndexes(index);

    const done=indexes.filter(i =>
      learnedWords.includes(i) ||
      studyWords.includes(i)
    ).length;

    let icon;

    if(complete){
      icon="✅";
    }else if(unlocked){
      icon="🔓";
    }else{
      icon="🔒";
    }

    btn.innerHTML=`
      <span>${icon} ${cat.title}</span>
      <span class="category-progress">${done}/${indexes.length}</span>
    `;

    if(unlocked){

      btn.onclick=()=>{

        selectedCategory=index;

        localStorage.setItem(
          "selectedCategory",
          selectedCategory
        );

        renderCategories();
        loadNewWord();

      };

    }else{

      btn.onclick=()=>{

        document.getElementById("unlockMessage").textContent=
          "🔒 আগে আগের Section-এর সব শব্দ শেষ করুন। তারপর এই Section unlock হবে।";

      };

    }

    box.appendChild(btn);

  });

}

   NAV
========================================================= */

function showSection(name){

  document.querySelectorAll(".section")
  .forEach(s=>s.classList.remove("active"));

  document.getElementById(name).classList.add("active");

  document.querySelectorAll("nav button")
  .forEach(b=>b.classList.remove("active"));

  const navMap={
    learn:"navLearn",
    practice:"navPractice",
    review:"navReview",
    learned:"navLearned",
    progress:"navProgress"
  };

  document.getElementById(navMap[name]).classList.add("active");

  if(name==="learn"){
    renderCategories();
    loadNewWord();
  }

  if(name==="practice"){
    startPractice();
  }

  if(name==="review"){
    loadReviewWord();
  }

  if(name==="learned"){
    loadLearnedWord();
  }

  if(name==="progress"){
    updateProgress();
  }
}


/* =========================================================
   CARD
========================================================= */

function fillCard(type,index){

  const w=words[index];

  meaningState[type]=false;
  exampleState[type]=false;

  document.getElementById(type+"Word").textContent=w.arabic;

  document.getElementById(type+"Meaning").textContent=w.meaning;

  document.getElementById(type+"Meaning")
  .classList.add("hidden");

  document.getElementById(type+"ExampleArabic").textContent=
    w.example || "";

  document.getElementById(type+"ExampleBangla").textContent=
    w.translation || "";

  document.getElementById(type+"Reference").textContent=
    w.surah && w.ayah
      ? w.surah+" — "+w.ayah
      : "";

  document.getElementById(type+"Example")
  .classList.remove("show");
}


function toggleMeaning(type){

  meaningState[type]=!meaningState[type];

  const el=document.getElementById(type+"Meaning");

  if(meaningState[type])
    el.classList.remove("hidden");
  else
    el.classList.add("hidden");
}


function toggleExample(type,event){

  event.stopPropagation();

  exampleState[type]=!exampleState[type];

  const box=document.getElementById(type+"Example");

  if(exampleState[type])
    box.classList.add("show");
  else
    box.classList.remove("show");
}


/* =========================================================
   LEARN
========================================================= */

function getCategoryNewWords(categoryIndex){

  return categoryWordIndexes(categoryIndex)
    .filter(i =>
      !learnedWords.includes(i) &&
      !studyWords.includes(i)
    );

}


function loadNewWord(){

  renderCategories();

  const cat=categories[selectedCategory];

  if(!cat) return;

  if(!isCategoryUnlocked(selectedCategory)){

    selectedCategory=0;

    localStorage.setItem(
      "selectedCategory",
      selectedCategory
    );

    loadNewWord();

    return;
  }

  const available=
    getCategoryNewWords(selectedCategory);

  document.getElementById("learnCategoryTitle").textContent=
    cat.title;

  if(available.length===0){

    document.getElementById("learnCounter").textContent=
      "🎉 এই Section শেষ";

    document.getElementById("learnWord").textContent=
      "مَاشَاءَ اللَّهُ";

    document.getElementById("learnMeaning").textContent=
      "এই Section-এর সব শব্দ শেষ হয়েছে।";

    document.getElementById("learnMeaning")
    .classList.remove("hidden");

    document.getElementById("learnExample")
    .classList.remove("show");

    const next=selectedCategory+1;

    if(next<categories.length){

      if(isCategoryUnlocked(next)){

        document.getElementById("unlockMessage").textContent=
          "🎉 পরের Section unlock হয়েছে!";

      }else{

        document.getElementById("unlockMessage").textContent=
          "✓ Section সম্পূর্ণ। পরের Section unlock করার জন্য completion save করা হয়েছে।";

      }

    }else{

      document.getElementById("unlockMessage").textContent=
        "🏆 সব Section সম্পূর্ণ!";

    }

    return;
  }

  learnIndex=available[0];

  fillCard("learn",learnIndex);

  document.getElementById("learnCounter").textContent=
    "নতুন শব্দ বাকি: "+available.length;

  document.getElementById("unlockMessage").textContent=
    "📖 এখন পড়ছেন: "+cat.title;
}


function learnCurrent(){

  if(learnIndex<0) return;

  if(!learnedWords.includes(learnIndex)){
    learnedWords.push(learnIndex);
  }

  studyWords=
    studyWords.filter(i=>i!==learnIndex);

  save();

  checkAndUnlock();

  loadNewWord();
}


function studyCurrent(){

  if(learnIndex<0) return;

  if(!studyWords.includes(learnIndex)){
    studyWords.push(learnIndex);
  }

  learnedWords=
    learnedWords.filter(i=>i!==learnIndex);

  save();

  checkAndUnlock();

  loadNewWord();
}


function checkAndUnlock(){

  updateCategoryCompletion();

  const next=selectedCategory+1;

  if(next<categories.length &&
     isCategoryUnlocked(next)){

    document.getElementById("unlockMessage").textContent=
      "🎉 "+categories[next].title+" unlock হয়েছে!";
  }
}

   REVIEW
========================================================= */

function loadReviewWord(){

  if(studyWords.length===0){

    document.getElementById("reviewCounter").textContent=
      "Review খালি";

    document.getElementById("reviewWord").textContent="📚";

    document.getElementById("reviewMeaning").textContent=
      "এখন কোনো পড়তে হবে শব্দ নেই";

    document.getElementById("reviewMeaning")
    .classList.remove("hidden");

    document.getElementById("reviewExample")
    .classList.remove("show");

    return;
  }

  if(reviewPosition>=studyWords.length)
    reviewPosition=0;

  const index=studyWords[reviewPosition];

  fillCard("review",index);

  document.getElementById("reviewCounter").textContent=
    "Review "+(reviewPosition+1)+" / "+studyWords.length;
}


function reviewToLearned(){

  if(studyWords.length===0) return;

  const index=studyWords[reviewPosition];

  if(!learnedWords.includes(index))
    learnedWords.push(index);

  studyWords=
    studyWords.filter(i=>i!==index);

  save();

  checkAndUnlock();

  if(reviewPosition>=studyWords.length)
    reviewPosition=0;

  loadReviewWord();
}


function reviewNext(){

  if(studyWords.length===0) return;

  reviewPosition++;

  if(reviewPosition>=studyWords.length)
    reviewPosition=0;

  loadReviewWord();
}


/* =========================================================
   LEARNED
========================================================= */

function loadLearnedWord(){

  if(learnedWords.length===0){

    document.getElementById("learnedCounter").textContent=
      "মুখস্থ খালি";

    document.getElementById("learnedWord").textContent="✓";

    document.getElementById("learnedMeaning").textContent=
      "এখনো কোনো শব্দ মুখস্থ করা হয়নি";

    document.getElementById("learnedMeaning")
    .classList.remove("hidden");

    return;
  }

  if(learnedPosition>=learnedWords.length)
    learnedPosition=0;

  fillCard("learned",index);

  document.getElementById("learnedCounter").textContent=
    "মুখস্থ "+(learnedPosition+1)+" / "+learnedWords.length;
}


function learnedNext(){

  if(learnedWords.length===0) return;

  learnedPosition++;

  if(learnedPosition>=learnedWords.length)
    learnedPosition=0;

  loadLearnedWord();
}


function learnedToReview(){

  if(learnedWords.length===0) return;

  const index=learnedWords[learnedPosition];

  learnedWords=
    learnedWords.filter(i=>i!==index);

  if(!studyWords.includes(index))
    studyWords.push(index);

  save();

  loadLearnedWord();
}


/* =========================================================
   PRACTICE
========================================================= */

let practiceMode=1;
let practiceQuestions=[];
let practiceIndex=0;
let practiceScore=0;
let answered=false;


/*
 * গুরুত্বপূর্ণ:
 * Practice-এ সব words নয়।
 * শুধু unlocked category-এর শব্দ আসবে।
 */

function getPracticeWords(){

  const result=[];

  categories.forEach((cat,index)=>{

    if(isCategoryUnlocked(index)){

      categoryWordIndexes(index)
      .forEach(wordIndex=>{

        /*
         * শব্দটি আগে পড়া হয়েছে কিনা:
         * learned অথবা study list-এ থাকলে Practice-এ আসবে।
         */

        if(
          learnedWords.includes(wordIndex) ||
          studyWords.includes(wordIndex)
        ){
          result.push(words[wordIndex]);
        }

      });

    }

  });

  return result;
}


function setMode(mode){

  practiceMode=mode;

  document.querySelectorAll(".modes button")
  .forEach(b=>b.classList.remove("active"));

  document.getElementById("mode"+mode)
  .classList.add("active");

  startPractice();
}


function startPractice(){

  const pool=getPracticeWords();

  document.getElementById("practiceAvailable").textContent=
    "📚 Practice-এর জন্য এখন "+pool.length+"টি পড়া শব্দ আছে।";

  if(pool.length===0){

    practiceQuestions=[];

    document.getElementById("practiceCount").textContent="";

    document.getElementById("questionLabel").textContent=
      "আগে Learn section-এর কিছু শব্দ পড়ুন।";

    document.getElementById("practiceQuestion").textContent=
      "📖";

    document.getElementById("answerArea").innerHTML="";

    document.getElementById("feedback").textContent=
      "শব্দ পড়লে সেগুলো এখানে Practice-এ আসবে।";

    document.getElementById("nextPractice").style.display="none";

    return;
  }

  practiceQuestions=
    [...pool]
    .sort(()=>Math.random()-.5)
    .slice(0,Math.min(10,pool.length));

  practiceIndex=0;
  practiceScore=0;

  showPracticeQuestion();
}


function showPracticeQuestion(){

  if(practiceIndex>=practiceQuestions.length){

    showPracticeResult();
    return;
  }

  answered=false;

  const w=practiceQuestions[practiceIndex];

  document.getElementById("practiceCount").textContent=
    "প্রশ্ন "+(practiceIndex+1)+" / "+practiceQuestions.length;

  document.getElementById("feedback").textContent="";

  document.getElementById("nextPractice").style.display="none";

  const q=document.getElementById("practiceQuestion");

  const label=document.getElementById("questionLabel");

  const area=document.getElementById("answerArea");

  area.innerHTML="";

  q.classList.remove("bangla");


  if(practiceMode===1){

    label.textContent="এর বাংলা অর্থ কী?";

    q.textContent=w.arabic;

    createOptions(w,"meaning");
  }


  if(practiceMode===2){

    label.textContent="এর আরবি শব্দ কোনটি?";

    q.textContent=w.meaning;

    q.classList.add("bangla");

    createOptions(w,"arabic");
  }


  if(practiceMode===3){

    label.textContent="বাংলা অর্থ লিখুন";

    q.textContent=w.arabic;

    createInput(w,"meaning");
  }


  if(practiceMode===4){

    label.textContent="আরবি শব্দ লিখুন";

    q.textContent=w.meaning;

    q.classList.add("bangla");

    createInput(w,"arabic");
  }

}


function createOptions(word,type){

  let answers=[word[type]];

  const pool=getPracticeWords();

  const others=
    pool
    .filter(w=>w.id!==word.id)
    .sort(()=>Math.random()-.5)
    .slice(0,3);

  others.forEach(w=>answers.push(w[type]));

  answers=
    [...new Set(answers)]
    .sort(()=>Math.random()-.5);

  const box=document.createElement("div");

  box.className="options";

  answers.forEach(answer=>{

    const btn=document.createElement("button");

    btn.className="option";

    btn.textContent=answer;

    btn.onclick=()=>checkOption(
      btn,
      answer,
      word[type],
      box
    );

    box.appendChild(btn);

  });

  document.getElementById("answerArea")
  .appendChild(box);
}


function checkOption(btn,answer,correct,box){

  if(answered) return;

  answered=true;

  practiceAttempts++;

  if(answer===correct){

    practiceRight++;
    practiceScore++;

    btn.classList.add("correct");

    document.getElementById("feedback").textContent=
      "✓ সঠিক উত্তর!";

  }else{

    btn.classList.add("wrong");

    document.getElementById("feedback").textContent=
      "✗ সঠিক উত্তর: "+correct;

    [...box.children].forEach(b=>{

      if(b.textContent===correct)
        b.classList.add("correct");

    });

  }

  save();

  document.getElementById("nextPractice")
  .style.display="block";
}


function createInput(word,type){

  const area=document.getElementById("answerArea");

  const input=document.createElement("input");

  input.className="answer-input";

  input.placeholder="উত্তর লিখুন";

  const button=document.createElement("button");

  button.className="check-btn";

  button.textContent="উত্তর দেখুন";

  button.onclick=()=>checkInput(
    input,
    word[type]
  );

  input.addEventListener("keydown",e=>{

    if(e.key==="Enter")
      checkInput(input,word[type]);

  });

  area.appendChild(input);
  area.appendChild(button);

  input.focus();
}


function normalize(text){

  return text
    .trim()
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/\s+/g," ");
}


function checkInput(input,correct){

  if(answered) return;

  answered=true;

  practiceAttempts++;

  const user=normalize(input.value);

  const right=normalize(correct);

  if(user===right){

    practiceRight++;
    practiceScore++;

    document.getElementById("feedback").textContent=
      "✓ সঠিক উত্তর!";

  }else{

    document.getElementById("feedback").textContent=
      "✗ সঠিক উত্তর: "+correct;

  }

  save();

  document.getElementById("nextPractice")
  .style.display="block";
}


function nextPractice(){

  practiceIndex++;

  showPracticeQuestion();
}


function showPracticeResult(){

  document.getElementById("questionLabel").textContent=
    "Practice শেষ";

  document.getElementById("practiceQuestion").textContent=
    "🎉 "+practiceScore+" / "+practiceQuestions.length;

  document.getElementById("practiceQuestion")
  .classList.add("bangla");

  document.getElementById("answerArea").innerHTML=`
    <button class="check-btn" onclick="startPractice()">
      আবার Practice করুন
    </button>
  `;

  document.getElementById("feedback").textContent=
    "Accuracy: "+
    Math.round(
      practiceScore/practiceQuestions.length*100
    )+"%";

  document.getElementById("nextPractice")
  .style.display="none";
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  const total=words.length;

  const completed=
    learnedWords.length+studyWords.length;

  const remaining=Math.max(
    0,
    total-completed
  );

  let accuracy=0;

  if(practiceAttempts>0){

    accuracy=Math.round(
      practiceRight/practiceAttempts*100
    );

  }

  document.getElementById("learnedCount").textContent=
    learnedWords.length;

  document.getElementById("reviewCount").textContent=
    studyWords.length;

  document.getElementById("remainingCount").textContent=
    remaining;

  document.getElementById("accuracyCount").textContent=
    accuracy+"%";


  const box=
    document.getElementById("progressCategories");

  box.innerHTML="";

  categories.forEach((cat,index)=>{

    const indexes=categoryWordIndexes(index);

    const done=indexes.filter(i=>
      learnedWords.includes(i) ||
      studyWords.includes(i)
    ).length;

    const unlocked=isCategoryUnlocked(index);

    const complete=isCategoryComplete(index);

    const div=document.createElement("div");

    div.style.padding="10px 0";
    div.style.borderBottom="1px solid #eee";

    div.innerHTML=`
      ${complete ? "✅" : unlocked ? "🔓" : "🔒"}
      <strong>${cat.title}</strong>
      <span style="float:right">
        ${done}/${indexes.length}
      </span>
    `;

    box.appendChild(div);

  });

}


/* =========================================================
   SAVE
========================================================= */

function save(){

  updateCategoryCompletion();

  localStorage.setItem(
    "learnedWords",
    JSON.stringify(learnedWords)
  );

  localStorage.setItem(
    "studyWords",
    JSON.stringify(studyWords)
  );

  localStorage.setItem(
    "completedCategories",
    JSON.stringify(completedCategories)
  );

  localStorage.setItem(
    "practiceAttempts",
    practiceAttempts
  );

  localStorage.setItem(
    "practiceRight",
    practiceRight
  );

  localStorage.setItem(
    "selectedCategory",
    selectedCategory
  );
}


/* =========================================================
   INITIAL
========================================================= */

updateCategoryCompletion();

renderCategories();

loadNewWord();

updateProgress();

</script>
