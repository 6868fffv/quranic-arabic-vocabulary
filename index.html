<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qur’anic Arabic Vocabulary</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f4;color:#183024;font-family:Arial,"Noto Sans Bengali",sans-serif}
header{background:#123d29;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.brand{font-weight:800}.top{font-size:13px}.wrap{max-width:820px;margin:auto;padding:20px 15px 50px}
.hero,.card{background:#fff;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #153d2910}
.hero{text-align:center;background:linear-gradient(145deg,#eaf5ea,#fff)}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#247447;color:#fff}.soft{background:#e7efe9;color:#1d5f3b}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.arabic{font-family:"Amiri","Times New Roman",serif;direction:rtl;font-size:54px;text-align:center;color:#174d31;margin:15px 0}.meaning{text-align:center;font-size:21px;font-weight:800}.pron{text-align:center;color:#718078;margin:8px}
.ayah{font-family:"Amiri","Times New Roman",serif;direction:rtl;text-align:right;font-size:28px;line-height:1.8}.translation{background:#f2f7f3;border-left:4px solid #3e8b5b;padding:12px;margin-top:10px}.ref{font-size:13px;color:#68756d;margin-top:8px}
.options{display:grid;gap:9px}.opt{width:100%;background:#f1f5f1;text-align:left}.opt:hover{background:#e4eee6}.feedback{min-height:28px;margin-top:12px;font-weight:800}.ok{color:#16723d}.bad{color:#a13e38}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f6f3;border-radius:14px;padding:14px;text-align:center}.num{font-size:22px;font-weight:800}.bar{height:12px;background:#e3eae4;border-radius:20px;overflow:hidden}.fill{height:100%;background:#3e8b5b;width:0%;transition:.3s}.hidden{display:none}.list p{padding:10px;background:#f5f7f5;border-radius:10px}
@media(max-width:560px){.arabic{font-size:45px}.ayah{font-size:23px}.stats{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">📖 Qur’anic Arabic Vocabulary</div><div class="top" id="top">0 / 20</div></header>
<div class="wrap">
<section class="hero"><div>Learn • Practice • Review</div><h1>কুরআনের আরবি শব্দ শেখো</h1><p>শব্দ শেখো, আয়াতে দেখো, Practice করো এবং Progress ট্র্যাক করো।</p><button class="primary" onclick="go('learn')">🚀 Start Learning</button></section>
<div class="nav"><button class="soft" onclick="go('learn')">📖 Learn</button><button class="soft" onclick="go('progress')">📊 Progress</button><button class="soft" onclick="go('review')">🔁 Review Mistakes</button></div>

<section id="learn">
<div class="card"><div id="count" style="color:#708077"></div><div class="arabic" id="ar"></div><div class="meaning" id="meaning"></div><div class="pron" id="pron"></div></div>
<div class="card"><h2>📖 Qur'anic Example</h2><div class="ayah" id="ayah"></div><div class="translation" id="trans"></div><div class="ref" id="ref"></div></div>
<div class="card"><h2>🧠 MCQ Practice</h2><p id="q"></p><div class="options" id="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="primary hidden" onclick="next()">Next Word →</button></div>
</section>

<section id="progress" class="hidden"><div class="card"><h2>📊 Your Progress</h2><div class="stats"><div class="stat"><div class="num" id="learned">0</div>Learned</div><div class="stat"><div class="num" id="acc">0%</div>Accuracy</div><div class="stat"><div class="num" id="mastered">0</div>Mastered</div></div><br><div class="bar"><div class="fill" id="fill"></div></div></div></section>

<section id="review" class="hidden"><div class="card"><h2>🔁 Review Mistakes</h2><div id="mistakes" class="list">এখনো কোনো ভুল শব্দ নেই।</div></div></section>
</div>
<script>
const words=[{"id": 1, "arabic": "اللَّهُ", "meaning": "আল্লাহ", "pron": "আল্লাহু", "ayah": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ", "translation": "আল্লাহ—তিনি ছাড়া কোনো উপাস্য নেই।", "ref": "2:255", "opts": ["আল্লাহ", "পথ", "কিতাব", "দিন"], "answer": "আল্লাহ"}, {"id": 2, "arabic": "رَبٌّ", "meaning": "রব / প্রতিপালক", "pron": "রব্বুন", "ayah": "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "translation": "সমস্ত প্রশংসা আল্লাহর, যিনি সকল জগতের রব।", "ref": "1:2", "opts": ["রব", "আলো", "পানি", "মানুষ"], "answer": "রব"}, {"id": 3, "arabic": "كِتَابٌ", "meaning": "কিতাব / গ্রন্থ", "pron": "কিতাবুন", "ayah": "ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ", "translation": "এটি সেই কিতাব, যাতে কোনো সন্দেহ নেই।", "ref": "2:2", "opts": ["কিতাব", "ঘর", "দিন", "আলো"], "answer": "কিতাব"}, {"id": 4, "arabic": "يَوْمٌ", "meaning": "দিন", "pron": "ইয়াওমুন", "ayah": "مَالِكِ يَوْمِ الدِّينِ", "translation": "বিচার দিনের মালিক।", "ref": "1:4", "opts": ["দিন", "রাত", "পথ", "হৃদয়"], "answer": "দিন"}, {"id": 5, "arabic": "نُورٌ", "meaning": "আলো", "pron": "নূরুন", "ayah": "اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ", "translation": "আল্লাহ আসমানসমূহ ও জমিনের আলো।", "ref": "24:35", "opts": ["আলো", "কিতাব", "পানি", "দিন"], "answer": "আলো"}, {"id": 6, "arabic": "قَلْبٌ", "meaning": "হৃদয় / অন্তর", "pron": "কলবুন", "ayah": "وَنَطْبَعُ عَلَىٰ قُلُوبِهِمْ", "translation": "আর আমরা তাদের অন্তরে মোহর করে দিই।", "ref": "7:100", "opts": ["হৃদয়", "ঘর", "আকাশ", "পথ"], "answer": "হৃদয়"}, {"id": 7, "arabic": "مَاءٌ", "meaning": "পানি", "pron": "মা'উন", "ayah": "وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ", "translation": "আমি পানি থেকে প্রত্যেক জীবন্ত জিনিস সৃষ্টি করেছি।", "ref": "21:30", "opts": ["পানি", "আলো", "দিন", "কিতাব"], "answer": "পানি"}, {"id": 8, "arabic": "أَرْضٌ", "meaning": "পৃথিবী / জমিন", "pron": "আরদুন", "ayah": "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "translation": "জমিনসহ সৃষ্টিজগত আল্লাহর সৃষ্টি।", "ref": "21:30", "opts": ["পৃথিবী", "আলো", "হৃদয়", "দিন"], "answer": "পৃথিবী"}, {"id": 9, "arabic": "سَمَاءٌ", "meaning": "আকাশ", "pron": "সামা'উন", "ayah": "خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ", "translation": "তিনি আসমানসমূহ ও জমিন সৃষ্টি করেছেন।", "ref": "6:1", "opts": ["আকাশ", "পানি", "কিতাব", "পথ"], "answer": "আকাশ"}, {"id": 10, "arabic": "صِرَاطٌ", "meaning": "পথ", "pron": "সিরাতুন", "ayah": "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", "translation": "আমাদের সরল পথ দেখান।", "ref": "1:6", "opts": ["পথ", "দিন", "রব", "আলো"], "answer": "পথ"}, {"id": 11, "arabic": "حَقٌّ", "meaning": "সত্য", "pron": "হাক্কুন", "ayah": "وَقُلْ جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ", "translation": "বলুন, সত্য এসেছে এবং অসত্য বিলুপ্ত হয়েছে।", "ref": "17:81", "opts": ["সত্য", "পানি", "রাত", "ঘর"], "answer": "সত্য"}, {"id": 12, "arabic": "عِلْمٌ", "meaning": "জ্ঞান", "pron": "ইলমুন", "ayah": "وَقُلْ رَبِّ زِدْنِي عِلْمًا", "translation": "বলুন, হে আমার রব, আমার জ্ঞান বৃদ্ধি করুন।", "ref": "20:114", "opts": ["জ্ঞান", "আলো", "দিন", "পথ"], "answer": "জ্ঞান"}, {"id": 13, "arabic": "رَحْمَةٌ", "meaning": "দয়া / রহমত", "pron": "রাহমাতুন", "ayah": "وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ", "translation": "আমার রহমত সবকিছুকে পরিব্যাপ্ত করেছে।", "ref": "7:156", "opts": ["দয়া", "কিতাব", "পৃথিবী", "রাত"], "answer": "দয়া"}, {"id": 14, "arabic": "مَغْفِرَةٌ", "meaning": "ক্ষমা", "pron": "মাগফিরাতুন", "ayah": "وَاللَّهُ غَفُورٌ رَحِيمٌ", "translation": "আল্লাহ ক্ষমাশীল, পরম দয়ালু।", "ref": "2:173", "opts": ["ক্ষমা", "জ্ঞান", "আলো", "পথ"], "answer": "ক্ষমা"}, {"id": 15, "arabic": "صَلَاةٌ", "meaning": "সালাত / নামাজ", "pron": "সালাতুন", "ayah": "وَأَقِيمُوا الصَّلَاةَ", "translation": "তোমরা সালাত কায়েম করো।", "ref": "2:43", "opts": ["সালাত", "রোজা", "কিতাব", "পথ"], "answer": "সালাত"}, {"id": 16, "arabic": "زَكَاةٌ", "meaning": "যাকাত", "pron": "যাকাতুন", "ayah": "وَآتُوا الزَّكَاةَ", "translation": "এবং যাকাত দাও।", "ref": "2:43", "opts": ["যাকাত", "আলো", "দিন", "জ্ঞান"], "answer": "যাকাত"}, {"id": 17, "arabic": "جَنَّةٌ", "meaning": "জান্নাত", "pron": "জান্নাতুন", "ayah": "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ", "translation": "তোমরা তোমাদের রবের ক্ষমা ও জান্নাতের দিকে দ্রুত অগ্রসর হও।", "ref": "3:133", "opts": ["জান্নাত", "পৃথিবী", "পানি", "রাত"], "answer": "জান্নাত"}, {"id": 18, "arabic": "نَارٌ", "meaning": "আগুন", "pron": "নারুন", "ayah": "فَاتَّقُوا النَّارَ", "translation": "অতএব আগুন থেকে বাঁচো।", "ref": "2:24", "opts": ["আগুন", "আলো", "পথ", "জ্ঞান"], "answer": "আগুন"}, {"id": 19, "arabic": "لَيْلٌ", "meaning": "রাত", "pron": "লাইলুন", "ayah": "وَجَعَلْنَا اللَّيْلَ لِبَاسًا", "translation": "আমি রাতকে করেছি আবরণ।", "ref": "78:10", "opts": ["রাত", "দিন", "আলো", "পথ"], "answer": "রাত"}, {"id": 20, "arabic": "نَهَارٌ", "meaning": "দিন / দিবাভাগ", "pron": "নাহারুন", "ayah": "وَجَعَلْنَا النَّهَارَ مَعَاشًا", "translation": "আমি দিনকে করেছি জীবিকা অর্জনের সময়।", "ref": "78:11", "opts": ["দিন", "রাত", "জ্ঞান", "পানি"], "answer": "দিন"}];
let i=0,attempts=0,right=0,learned=new Set(),mistakes=new Set(),locked=false;
function render(){let w=words[i];locked=false;
document.getElementById('count').textContent=`Word ${i+1} / ${words.length}`;
ar.textContent=w.arabic;meaning.textContent=w.meaning;pron.textContent='🔊 উচ্চারণ: '+w.pron;ayah.textContent=w.ayah;trans.textContent='বাংলা অর্থ: '+w.translation;ref.textContent='সূরা-আয়াত: '+w.ref;
q.textContent=`“${w.arabic}” শব্দটির বাংলা অর্থ কী?`;feedback.textContent='';feedback.className='feedback';next.classList.add('hidden');opts.innerHTML='';
[...w.opts].sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>answer(x);opts.appendChild(b)});update()}
function answer(x){if(locked)return;locked=true;attempts++;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
if(x===words[i].answer){right++;learned.add(i);feedback.textContent='✅ সঠিক উত্তর!';feedback.className='feedback ok'}else{mistakes.add(i);feedback.textContent='❌ ভুল। এই শব্দটি Review-তে রাখা হলো।';feedback.className='feedback bad'}next.classList.remove('hidden');update()}
function next(){i=(i+1)%words.length;render()}
function go(id){['learn','progress','review'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='review')review()}
function review(){mistakesEl=document.getElementById('mistakes');mistakesEl.innerHTML=mistakes.size?[...mistakes].map(x=>`<p><b>${words[x].arabic}</b> — ${words[x].meaning} <button class="soft" onclick="i=${x};go('learn');render()">Practice</button></p>`).join(''):'এখনো কোনো ভুল শব্দ নেই।'}
function update(){learned.textContent=learned.size;mastered.textContent=learned.size;acc.textContent=(attempts?Math.round(right/attempts*100):0)+'%';fill.style.width=(learned.size/words.length*100)+'%';top.textContent=learned.size+' / '+words.length}
render();
</script></body></html>
